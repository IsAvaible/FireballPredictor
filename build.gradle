plugins {
	id 'java-library'
	alias(libs.plugins.mod.publish)
	id 'maven-publish'
}

String loader = project.property("loader").toString()
boolean isFabric = loader == "fabric"
boolean isNeoForge = loader == "neoforge"

if (isFabric) {
	apply plugin: libs.plugins.loom.get().pluginId
} else if (isNeoForge) {
	apply plugin: libs.plugins.moddev.get().pluginId
}

version = "${project.mod_version}+${project.minecraft_version}-${loader}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "NeoForge"
		url = "https://maven.neoforged.net/releases/"
	}
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven { url = "https://maven.terraformersmc.com/releases" }
}

boolean enableShaders = project.hasProperty("shaders") || project.hasProperty("withShaders") || gradle.startParameter.taskNames.any { it.contains("WithShaders") }

configurations {
	shaderPack {
		transitive = false
	}
}

if (isNeoForge) {
	neoForge {
		version = libs.versions.neoforge.get()

		runs {
			client {
				client()
				systemProperty "neoforge.disableBlaze3DValidation", "true"
			}
			server {
				server()
			}
		}

		mods {
			"${project.archives_base_name}" {
				sourceSet sourceSets.main
			}
		}
	}
}

dependencies {
	if (isFabric) {
		minecraft libs.minecraft
		implementation libs.fabric.loader
		implementation libs.fabric.api
		implementation libs.yacl.fabric
		implementation libs.modmenu
		compileOnly libs.iris.fabric

		if (enableShaders) {
			localRuntime libs.sodium.fabric
			localRuntime libs.iris.fabric

			// Add the GLSL Transformer and JCPP dependencies for Iris
			localRuntime libs.jcpp
			localRuntime libs.glslTransformer
		}
	} else if (isNeoForge) {
		implementation libs.yacl.neoforge
		compileOnly libs.iris.neoforge

		if (enableShaders) {
			runtimeOnly libs.sodium.neoforge
			runtimeOnly libs.iris.neoforge
			runtimeOnly libs.jcpp
			runtimeOnly libs.glslTransformer
		}
	}

	shaderPack "maven.modrinth:complementary-reimagined:${libs.versions.complementary.reimagined.get()}@zip"
}

tasks.register("setupShaders", Copy) {
	group = isFabric ? "fabric" : "neoforge"
	description = "Prepares shader packs and configures Iris for shader testing."
	from configurations.shaderPack
	into "run/shaderpacks"

	def shaderVersion = libs.versions.complementary.reimagined.get()
	def shaderFileName = "ComplementaryReimagined_${shaderVersion}.zip"
	rename { shaderFileName }

	doLast {
		def irisConfigFile = file("run/config/iris.properties")
		def irisProperties = new Properties()
		if (irisConfigFile.exists()) {
			irisConfigFile.withInputStream { irisProperties.load(it) }
		}
		irisProperties.setProperty("enableShaders", "true")
		irisProperties.setProperty("shaderPack", shaderFileName)
		irisConfigFile.parentFile.mkdirs()
		irisConfigFile.withOutputStream { irisProperties.store(it, "Iris configuration generated by Gradle setupShaders") }
		println "Configured Iris to pre-select ${shaderFileName}"
	}
}

if (enableShaders) {
	tasks.matching { it.name == "runClient" }.configureEach {
		dependsOn(tasks.named("setupShaders"))
	}
}

tasks.register("runClientWithShaders") {
	group = isFabric ? "fabric" : "neoforge"
	description = "Runs the Minecraft client with Sodium, Iris, and Complementary Reimagined pre-selected."
	dependsOn(tasks.named("setupShaders"), tasks.named("runClient"))
}

if (isFabric) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "fireballpredictor_testmod"
		}
	}

	tasks.named("check") {
		dependsOn(tasks.named("runGameTest"))
	}
}

tasks.withType(ProcessResources).configureEach {
	inputs.property "version", project.version
	inputs.property "loader", loader

	if (isFabric) {
		exclude("META-INF/neoforge.mods.toml")
		filesMatching("fabric.mod.json") {
			expand "version": project.version
		}
	} else if (isNeoForge) {
		exclude("fabric.mod.json")
		filesMatching("META-INF/neoforge.mods.toml") {
			expand "version": project.version
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

def getLatestChangelog() {
	def changelogFile = rootProject.file("CHANGELOG.md")
	if (!changelogFile.exists()) return "See release notes for details."
	def text = changelogFile.text
	def versionPattern = java.util.regex.Pattern.quote(project.mod_version.toString())
	def matcher = (text =~ /(?s)##\s*\[?${versionPattern}\]?.*?\r?\n(.*?)(?=\r?\n#{1,2}\s*\[?\d|\z)/)
	if (matcher.find()) {
		return matcher.group(1).trim()
	}
	logger.warn("Could not find changelog entry for version ${project.mod_version} in CHANGELOG.md; falling back to default message.")
	return "Release notes for version ${project.mod_version}"
}

publishMods {
	file = tasks.jar.archiveFile
	changelog = providers.environmentVariable("CHANGELOG").orElse(provider { getLatestChangelog() })
	type = STABLE
	modLoaders.add(loader)

	String loaderDisplay = isFabric ? "Fabric" : "NeoForge"
	displayName = "FireballPredictor ${project.mod_version} (${loaderDisplay} ${project.minecraft_version})"

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "LpgQ68pt" // fireball-predictor
		minecraftVersions.add(project.minecraft_version)
		environment = CLIENT_ONLY_SERVER_OPTIONAL

		if (isFabric) {
			requires {
				slug = "fabric-api"
				version = libs.versions.fabric.api.get()
			}
			requires {
				slug = "yacl"
				version = libs.versions.yacl.fabric.get()
			}
			optional {
				slug = "modmenu"
			}
		} else if (isNeoForge) {
			requires {
				slug = "yacl"
				version = libs.versions.yacl.neoforge.get()
			}
		}
	}

	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		projectId = "1613094"
		minecraftVersions.add(project.minecraft_version)
		javaVersions.add(JavaVersion.VERSION_25)
		client = true
		server = true

		if (isFabric) {
			requires {
				slug = "fabric-api"
			}
			requires {
				slug = "yacl"
			}
			optional {
				slug = "modmenu"
			}
		} else if (isNeoForge) {
			requires {
				slug = "yacl"
			}
		}
	}

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = providers.environmentVariable("GITHUB_REPOSITORY").orElse("user/FireballPredictor")
		commitish = providers.environmentVariable("GITHUB_SHA").orElse("main")
		tagName = providers.environmentVariable("GITHUB_REF_NAME").orElse("v${project.mod_version}+${project.minecraft_version}")
		displayName = "FireballPredictor ${project.mod_version} (MC ${project.minecraft_version})"

		if (isNeoForge) {
			parent project(":26.3-fabric").tasks.named("publishGithub")
		}
	}
}

tasks.named("publishMods") {
	dependsOn(tasks.named("check"))
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = "${project.archives_base_name}-${loader}"
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}
