plugins {
	alias(libs.plugins.loom)
	alias(libs.plugins.mod.publish)
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven { url = "https://maven.terraformersmc.com/releases" }
}

boolean enableShaders = project.hasProperty("shaders") || project.hasProperty("withShaders") || gradle.startParameter.taskNames.any { it.contains("WithShaders") }

dependencies {
	minecraft libs.minecraft
	implementation libs.fabric.loader
	implementation libs.fabric.api
	implementation libs.yacl
	implementation libs.modmenu
	compileOnly "maven.modrinth:iris:1.11.2+26.2-fabric"

	if (enableShaders) {
        localRuntime libs.sodium
        localRuntime libs.iris

		// Add the GLSL Transformer and JCPP dependencies for Iris
		localRuntime libs.jcpp
		localRuntime libs.glslTransformer
    }
}

tasks.register("setupShaders") {
	group = "fabric"
	description = "Prepares shader packs and configures Iris for shader testing."
	doLast {
		def shaderDir = file("run/shaderpacks")
		def configDir = file("run/config")
		if (!shaderDir.exists()) shaderDir.mkdirs()
		if (!configDir.exists()) configDir.mkdirs()

		def shaderVersion = libs.versions.complementary.reimagined.get()
		def shaderFileName = "ComplementaryReimagined_${shaderVersion}.zip"
		def shaderFile = file("run/shaderpacks/${shaderFileName}")
		if (!shaderFile.exists()) {
			println "Downloading Complementary Reimagined shaderpack..."
			new URL("https://cdn.modrinth.com/data/HVnmMxH1/versions/yCCduG44/${shaderFileName}")
					.withInputStream { ins -> shaderFile.withOutputStream { outs -> outs << ins } }
			println "Downloaded shaderpack to ${shaderFile}"
		}

		def irisConfigFile = file("run/config/iris.properties")
		def irisProperties = new Properties()
		if (irisConfigFile.exists()) {
			irisConfigFile.withInputStream { irisProperties.load(it) }
		}
		irisProperties.setProperty("enableShaders", "true")
		irisProperties.setProperty("shaderPack", shaderFileName)
		irisConfigFile.withOutputStream { irisProperties.store(it, "Iris configuration generated by Gradle setupShaders") }
		println "Configured Iris to pre-select ${shaderFileName}"
	}
}

if (enableShaders) {
	tasks.named("runClient").configure {
		dependsOn(tasks.named("setupShaders"))
	}
}

tasks.register("runClientWithShaders") {
	group = "fabric"
	description = "Runs the Minecraft client with Sodium, Iris, and Complementary Reimagined pre-selected."
	dependsOn(tasks.named("setupShaders"), tasks.named("runClient"))
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "fireballpredictor_testmod"
    }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}

	exclude "**/icon-256px.png"
	exclude "**/icon.pxo"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

def getLatestChangelog() {
	def changelogFile = file("CHANGELOG.md")
	if (!changelogFile.exists()) return "See release notes for details."
	def text = changelogFile.text
	def matcher = (text =~ /(?s)##\s*\[?${project.mod_version}\]?.*?\n(.*?)(?=\n##\s*\[?\d|\z)/)
	return matcher.find() ? matcher.group(1).trim() : "Release notes for version ${project.mod_version}"
}

publishMods {
	file = tasks.jar.archiveFile
	changelog = providers.environmentVariable("CHANGELOG").orElse(provider { getLatestChangelog() })
	type = STABLE
	modLoaders.add("fabric")

	displayName = "FireballPredictor ${project.mod_version} (MC ${project.minecraft_version})"

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "LpgQ68pt" // fireball-predictor
		minecraftVersions.add(project.minecraft_version)
		environment = CLIENT_ONLY_SERVER_OPTIONAL

		requires {
			slug = "fabric-api"
			version = libs.versions.fabric.api.get()
		}
		requires {
			slug = "yacl"
			version = libs.versions.yacl.get()
		}
		optional {
			slug = "modmenu"
		}
	}

	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		projectId = "1613094"
		minecraftVersions.add(project.minecraft_version)
		javaVersions.add(JavaVersion.VERSION_25)
		client = true
		server = true

		requires {
			slug = "fabric-api"
		}
		requires {
			slug = "yacl"
		}
		optional {
			slug = "modmenu"
		}
	}

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = providers.environmentVariable("GITHUB_REPOSITORY").orElse("user/FireballPredictor")
		commitish = providers.environmentVariable("GITHUB_SHA").orElse("main")
		tagName = providers.environmentVariable("GITHUB_REF_NAME").orElse("v${project.mod_version}+${project.minecraft_version}")
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}
